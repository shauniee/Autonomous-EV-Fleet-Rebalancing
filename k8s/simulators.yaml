apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ev-moving-extra
  labels:
    app.kubernetes.io/group: simulations
spec:
  serviceName: ev-moving-extra
  replicas: 18
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # These simulators are independent. Update a bounded batch at a time
      # instead of waiting for every EV Pod sequentially. Five at a time keeps
      # Fleet load bounded while reducing an 18-wave rollout to about 4 waves.
      maxUnavailable: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: ev-moving-extra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ev-moving-extra
        app.kubernetes.io/component: simulator
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ev-moving-extra
          image: csc3104/ev-fleet-backend:k8s-local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: ev-fleet-config
          command: ["sh", "-c"]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              case "$((ordinal % 6))" in
                0) zone="jurong-east" ;;
                1) zone="woodlands" ;;
                2) zone="bishan" ;;
                3) zone="punggol" ;;
                4) zone="tampines" ;;
                5) zone="cbd" ;;
              esac
              soc="$((65 + (ordinal * 7) % 31))"
              exec python -m ev_fleet.simulator.cli \
                --fleet-url http://fleet:8000 \
                --dispatch-url http://dispatch:8000 \
                --vehicle-id "$HOSTNAME" \
                --zone "$zone" \
                --soc "$soc" \
                --checkpointing \
                --time-scale "$SIMULATION_TIME_SCALE"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            # Parallel startup of the extra fleet shares the local node's CPU.
            timeoutSeconds: 10
            failureThreshold: 8
          # Local coordination readiness is separate from physical freshness
          # and dispatch eligibility, including supervised recovery waits.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

