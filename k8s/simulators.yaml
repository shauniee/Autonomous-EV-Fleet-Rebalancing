apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-moving-01
  labels:
    app.kubernetes.io/group: simulations
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ev-moving-01
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ev-moving-01
        app.kubernetes.io/component: simulator
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ev-moving-01
          image: csc3104/ev-fleet-backend:k8s-local
          imagePullPolicy: Never
          command: ["python", "-m", "ev_fleet.simulator.cli"]
          args:
            - --fleet-url
            - http://fleet:8000
            - --dispatch-url
            - http://dispatch:8000
            - --vehicle-id
            - ev-moving-01
            - --zone
            - bishan
            - --soc
            - "90"
            - --checkpointing
            - --time-scale
            - $(SIMULATION_TIME_SCALE)
          envFrom:
            - configMapRef:
                name: ev-fleet-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Local coordination readiness is separate from physical freshness
          # and dispatch eligibility, including supervised recovery waits.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
