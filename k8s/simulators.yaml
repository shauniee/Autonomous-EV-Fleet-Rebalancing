apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-moving-01
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ev-moving-01
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ev-moving-01
        app.kubernetes.io/component: simulator
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ev-moving-01
          image: csc3104/ev-fleet-backend:k8s-local
          imagePullPolicy: Never
          command: ["python", "-m", "ev_fleet.simulator.cli"]
          args:
            - --fleet-url
            - http://fleet:8000
            - --dispatch-url
            - http://dispatch:8000
            - --vehicle-id
            - ev-moving-01
            - --zone
            - bishan
            - --soc
            - "90"
            - --time-scale
            - $(SIMULATION_TIME_SCALE)
          envFrom:
            - configMapRef:
                name: ev-fleet-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://fleet:8000/api/v1/vehicles/ev-moving-01', timeout=2)); assert d['telemetry'] and d['connectivity']=='ONLINE' and not d['stale']"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
