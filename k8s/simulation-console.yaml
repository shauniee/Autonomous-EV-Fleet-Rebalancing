apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-console
  labels:
    app.kubernetes.io/group: simulations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulation-console
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: simulation-console-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulation-console
          image: csc3104/ev-fleet-simulation-console:k8s-local
          imagePullPolicy: Never
          env:
            - name: ANALYTICS_K8S_READ
              value: "true"
            - name: ANALYTICS_LOAD_ENABLED
              value: "true"
            - name: ANALYTICS_DATA_DIR
              value: /data/analytics
            - name: ANALYTICS_DASHBOARD_URL
              value: http://dashboard/
            - name: RENTAL_K8S_CONTROL
              value: 'true'
            - name: FLEET_URL
              value: http://fleet:8000
            - name: DEMAND_URL
              value: http://demand:8000
            - name: REBALANCING_URL
              value: http://rebalancing:8000
            - name: DISPATCH_URL
              value: http://dispatch:8000
          envFrom:
            - secretRef:
                name: ev-fleet-traffic-control
                optional: true
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: analytics-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: simulation-analytics-data
