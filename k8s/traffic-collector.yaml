# One background process owns LTA polling; Rebalancing serves read-only Redis
# snapshots and never downloads the full feed inside its health-checked API Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-collector
        app.kubernetes.io/component: collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-collector
          image: csc3104/ev-fleet-backend:k8s-local
          imagePullPolicy: Never
          command: ["python", "-m", "ev_fleet.rebalancing.shared_traffic"]
          envFrom:
            - configMapRef:
                name: ev-fleet-config
            - secretRef:
                name: ev-fleet-facilities
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
