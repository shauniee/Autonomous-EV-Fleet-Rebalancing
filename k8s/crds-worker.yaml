# Optional: intentionally outside the default kustomization. No state or secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crds-worker
  namespace: ev-fleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: crds-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crds-worker
        app.kubernetes.io/part-of: autonomous-ev-fleet-rebalancing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evaluator
          image: csc3104/ev-fleet-backend:k8s-local
          imagePullPolicy: Never
          command: [uvicorn, "ev_fleet.rebalancing.crds_worker:app", --host, "0.0.0.0", --port, "8000", --workers, "1"]
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crds-worker
  namespace: ev-fleet
spec:
  selector:
    app.kubernetes.io/name: crds-worker
  ports:
    - name: http
      port: 8000
      targetPort: http
