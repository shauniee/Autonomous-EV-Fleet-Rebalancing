apiVersion: v1
kind: Secret
metadata:
  name: ev-fleet-database
type: Opaque
stringData:
  # Local Docker Desktop development credentials only; do not reuse externally.
  POSTGRES_DB: ev_fleet
  POSTGRES_USER: ev_fleet
  POSTGRES_PASSWORD: ev-fleet-local
  DATABASE_URL: postgresql://ev_fleet:ev-fleet-local@postgres:5432/ev_fleet
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: persistence
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-postgres-volume
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              data=/var/lib/postgresql/data/pgdata
              mkdir -p /var/run/postgresql
              chown 999:999 /var/run/postgresql
              chmod 775 /var/run/postgresql

              if [ -f "$data/PG_VERSION" ]; then
                # Existing database files must never be recursively chowned:
                # Docker Desktop hostpath may reject chown even for correct owner.
                owner="$(stat -c '%u:%g' "$data")"
                mode="$(stat -c '%a' "$data")"
                if [ "$owner" != "999:999" ] || [ "$mode" != "700" ]; then
                  echo >&2 "Existing PostgreSQL data has unexpected owner/mode: $owner $mode; refusing to mutate stored database."
                  exit 1
                fi
                echo "Existing PostgreSQL data ownership verified; preserving files."
              else
                # Only initialize permissions for a new empty data directory.
                mkdir -p "$data"
                owner="$(stat -c '%u:%g' "$data")"
                mode="$(stat -c '%a' "$data")"
                if [ "$owner" != "999:999" ]; then
                  chown 999:999 "$data"
                fi
                if [ "$mode" != "700" ]; then
                  chmod 700 "$data"
                fi
                echo "New PostgreSQL data directory prepared."
              fi
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ev-fleet-database
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Explicit for new clusters; does not overwrite existing pg_hba.conf.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: postgres
              containerPort: 5432
          # The official image runs a temporary Unix-socket-only postmaster
          # during initdb. Probing TCP keeps liveness disabled until bootstrap
          # finishes, rather than killing slow laptop initialization midway.
          startupProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -q -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 180
          # pg_isready alone can succeed for a nonexistent database. Require an
          # actual SQL query through Pod-IP TCP with the configured password.
          # This also tests pg_hba.conf rules used by other Kubernetes Pods.
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  result=$(PGPASSWORD="$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=3 \
                    psql -X -qAt -h "$POD_IP" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    -c 'SELECT 1') || exit 1
                  test "$result" = "1"
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 3
          # Liveness checks only the server process; missing DB/auth must not
          # repeatedly kill or re-initialize a potentially recoverable PVC.
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -q -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
      volumes:
        - name: postgres-run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
