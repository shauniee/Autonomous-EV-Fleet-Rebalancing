# Optional persistent customer demo in existing ev-fleet cluster.
# NEVER apply together with customer-job.yaml: both own the same vehicle IDs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-rental-demo
  namespace: ev-fleet
  labels:
    app.kubernetes.io/name: customer-rental-demo
    app.kubernetes.io/group: simulations
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-rental-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-rental-demo
        app.kubernetes.io/component: simulation
        app.kubernetes.io/group: simulations
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: customer-simulator
          image: csc3104/ev-fleet-backend:k8s-local
          imagePullPolicy: Never
          command: ["python", "-m", "ev_fleet.simulations.customer"]
          args: ["--scenario", "morning", "--vehicles", "6", "--duration-minutes", "60", "--rate-per-hour", "18", "--seed", "42", "--keep-alive"]
          envFrom:
            - configMapRef:
                name: ev-fleet-config
          env:
            - name: DISPATCH_URL
              value: http://dispatch:8000
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
