# Optional finite experiment, deployed in the existing ev-fleet cluster.
# Not included in base kustomization: no customers are generated on ordinary startup.
apiVersion: batch/v1
kind: Job
metadata:
  name: customer-rental-simulation
  namespace: ev-fleet
  labels:
    app.kubernetes.io/name: customer-rental-simulation
    app.kubernetes.io/group: simulations
spec:
  backoffLimit: 0
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-rental-simulation
        app.kubernetes.io/component: simulation
        app.kubernetes.io/group: simulations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: customer-simulator
          image: csc3104/ev-fleet-backend:k8s-local
          imagePullPolicy: Never
          command: ["python", "-m", "ev_fleet.simulations.customer"]
          args: ["--scenario", "morning", "--vehicles", "6", "--duration-minutes", "60", "--rate-per-hour", "18", "--seed", "42"]
          envFrom:
            - configMapRef:
                name: ev-fleet-config
          env:
            - name: DISPATCH_URL
              value: http://dispatch:8000
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
