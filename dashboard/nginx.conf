server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Resolve at request time: the UI can still load during backend outages.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    location = /health { access_log off; return 200 'ok'; }
    location ~ ^/api/(fleet|demand|rebalancing|dispatch)/(.*)$ {
        set $service $1;
        set $endpoint $2;
        proxy_pass http://$service:8000/api/v1/$endpoint$is_args$args;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
