x-backend: &backend
  build: .
  init: true
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  dashboard:
    build: ./dashboard
    profiles: [relocation]
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8080}:80"]
  fleet:
    <<: *backend
    ports: ["127.0.0.1:${FLEET_PORT:-8001}:8000"]
    environment:
      STALE_SECONDS: ${STALE_SECONDS:-15}
      OFFLINE_SECONDS: ${OFFLINE_SECONDS:-30}
      MIN_RESERVE_PCT: ${MIN_RESERVE_PCT:-20}
      ROUTE_FACTOR: ${ROUTE_FACTOR:-1.3}
      ENERGY_MARGIN_FACTOR: ${ENERGY_MARGIN_FACTOR:-1.15}
      ARRIVAL_TOLERANCE_KM: ${ARRIVAL_TOLERANCE_KM:-0.05}
  demand:
    <<: *backend
    command: ["uvicorn", "ev_fleet.demand.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports: ["127.0.0.1:${DEMAND_PORT:-8002}:8000"]
    environment:
      FLEET_URL: http://fleet:8000
      MIN_RESERVE_PCT: ${MIN_RESERVE_PCT:-20}
      DEMAND_SIMULATION_ENABLED: ${DEMAND_SIMULATION_ENABLED:-false}
      DEMAND_RANDOM_SEED: ${DEMAND_RANDOM_SEED:-42}
      DEMAND_UPDATE_INTERVAL_SECONDS: ${DEMAND_UPDATE_INTERVAL_SECONDS:-30}
      DEMAND_MIN_DEMAND: ${DEMAND_MIN_DEMAND:-0}
      DEMAND_MAX_DEMAND: ${DEMAND_MAX_DEMAND:-20}
      DEMAND_MAX_STEP: ${DEMAND_MAX_STEP:-3}
      DEMAND_MANUAL_HOLD_SECONDS: ${DEMAND_MANUAL_HOLD_SECONDS:-60}
      DEMAND_MAX_AGE_SECONDS: ${DEMAND_MAX_AGE_SECONDS:-300}
      DEMAND_FLEET_SNAPSHOT_MAX_AGE_SECONDS: ${DEMAND_FLEET_SNAPSHOT_MAX_AGE_SECONDS:-5}
      DEMAND_TELEMETRY_MAX_AGE_SECONDS: ${DEMAND_TELEMETRY_MAX_AGE_SECONDS:-15}
      DEMAND_ZONE_RADIUS_KM: ${DEMAND_ZONE_RADIUS_KM:-2}
      DEMAND_CRITICAL_SHORTAGE_RATIO: ${DEMAND_CRITICAL_SHORTAGE_RATIO:-0.5}
      DEMAND_MEDIUM_DEMAND: ${DEMAND_MEDIUM_DEMAND:-5}
      DEMAND_HIGH_DEMAND: ${DEMAND_HIGH_DEMAND:-10}
      DEMAND_FLEET_TIMEOUT_SECONDS: ${DEMAND_FLEET_TIMEOUT_SECONDS:-2}
  rebalancing:
    <<: *backend
    command: ["uvicorn", "ev_fleet.rebalancing.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports: ["127.0.0.1:${REBALANCING_PORT:-8003}:8000"]
    environment:
      FLEET_URL: http://fleet:8000
      DEMAND_URL: http://demand:8000
      FACILITIES_URL: http://facilities:8000
      STALE_SECONDS: ${STALE_SECONDS:-15}
      OFFLINE_SECONDS: ${OFFLINE_SECONDS:-30}
      MIN_RESERVE_PCT: ${MIN_RESERVE_PCT:-20}
      ROUTE_FACTOR: ${ROUTE_FACTOR:-1.3}
      ENERGY_MARGIN_FACTOR: ${ENERGY_MARGIN_FACTOR:-1.15}
      DISTANCE_SCALE_KM: ${DISTANCE_SCALE_KM:-50}
      RECOMMENDATION_TTL_SECONDS: ${RECOMMENDATION_TTL_SECONDS:-10}
      CHARGING_MAX_AGE_SECONDS: ${CHARGING_MAX_AGE_SECONDS:-3600}
    depends_on:
      fleet: {condition: service_healthy}
      demand: {condition: service_healthy}
  ev-01:
    build: .
    init: true
    command: ["python", "-m", "ev_fleet.simulator.cli", "--fleet-url", "http://fleet:8000", "--vehicle-id", "ev-01", "--zone", "bishan", "--soc", "80"]
    depends_on:
      fleet: {condition: service_healthy}
  ev-02:
    build: .
    init: true
    command: ["python", "-m", "ev_fleet.simulator.cli", "--fleet-url", "http://fleet:8000", "--vehicle-id", "ev-02", "--zone", "tampines", "--soc", "35"]
    depends_on:
      fleet: {condition: service_healthy}
  facilities:
    <<: *backend
    profiles: [relocation]
    command: ["uvicorn", "ev_fleet.facilities.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports: ["127.0.0.1:${FACILITIES_PORT:-8005}:8000"]
  dispatch:
    <<: *backend
    profiles: [relocation]
    command: ["uvicorn", "ev_fleet.dispatch.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports: ["127.0.0.1:${DISPATCH_PORT:-8004}:8000"]
    environment:
      FLEET_URL: http://fleet:8000
      DEMAND_URL: http://demand:8000
      FACILITIES_URL: http://facilities:8000
      REBALANCING_URL: http://rebalancing:8000
      STALE_SECONDS: ${STALE_SECONDS:-15}
      OFFLINE_SECONDS: ${OFFLINE_SECONDS:-30}
      MIN_RESERVE_PCT: ${MIN_RESERVE_PCT:-20}
      ROUTE_FACTOR: ${ROUTE_FACTOR:-1.3}
      ENERGY_MARGIN_FACTOR: ${ENERGY_MARGIN_FACTOR:-1.15}
      ACK_TIMEOUT_SECONDS: ${ACK_TIMEOUT_SECONDS:-15}
      PROGRESS_TIMEOUT_SECONDS: ${PROGRESS_TIMEOUT_SECONDS:-30}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-1}
    depends_on:
      fleet: {condition: service_healthy}
      demand: {condition: service_healthy}
      rebalancing: {condition: service_healthy}
  ev-moving-01:
    build: .
    init: true
    profiles: [relocation]
    command: ["python", "-m", "ev_fleet.simulator.cli", "--fleet-url", "http://fleet:8000", "--dispatch-url", "http://dispatch:8000", "--vehicle-id", "ev-moving-01", "--zone", "bishan", "--soc", "90", "--time-scale", "${SIMULATION_TIME_SCALE:-30}"]
    depends_on:
      fleet: {condition: service_healthy}
      dispatch: {condition: service_healthy}
  ev-moving-02:
    build: .
    init: true
    profiles: [relocation]
    command: ["python", "-m", "ev_fleet.simulator.cli", "--fleet-url", "http://fleet:8000", "--dispatch-url", "http://dispatch:8000", "--vehicle-id", "ev-moving-02", "--zone", "tampines", "--soc", "60", "--time-scale", "${SIMULATION_TIME_SCALE:-30}"]
    depends_on:
      fleet: {condition: service_healthy}
      dispatch: {condition: service_healthy}
