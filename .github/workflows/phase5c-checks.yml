name: Fleet regression and Redis dashboard cache

on:
  push:
    branches: [feat/phase5a-mock-parking-charging]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: docker compose --profile relocation config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build


  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and start live Compose demonstration
        run: |
          docker compose --profile relocation up --build -d --wait \
            redis fleet demand rebalancing dispatch facilities ev-moving-01 ev-moving-02 dashboard
      - name: Verify live parking-aware batch approval
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from uuid import uuid4

          origin = 'http://127.0.0.1:8080'
          def request(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              headers = {'Content-Type': 'application/json'} if data else {}
              req = urllib.request.Request(origin + path, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=8) as res:
                  return json.load(res)

          for attempt in range(45):
              try:
                  fleet = request('/api/fleet/vehicles')
                  available = [v for v in fleet['vehicles']
                               if v['effective_availability'] == 'AVAILABLE']
                  if len(available) >= 2:
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise AssertionError('Two fresh moving EVs were not available for smoke test')

          sites = request('/api/facilities/facilities?zone_id=cbd')
          assert sites['data_source'] == 'MOCK'
          assert len(sites['facilities']) == 3
          proposal = request('/api/rebalancing/batch-recommendations',
                             {'target_zone_id': 'cbd', 'quantity': 2})
          assert proposal['recommended_count'] == 2, proposal
          approval = request('/api/dispatch/batches',
                             {'request_id': str(uuid4()),
                              'batch_recommendation_id': proposal['batch_recommendation_id']})
          assert approval['status'] == 'APPROVED', approval
          assert len(approval['items']) == 2, approval
          print('Compose live batch smoke: 2 mock parking-aware EV dispatches approved')

          # Dedicated dashboard endpoint uses Redis; operational endpoint does not.
          def cache_call(path):
              with urllib.request.urlopen(origin + path, timeout=8) as response:
                  return response.headers['X-Dashboard-Cache'], json.load(response)
          first, facilities1 = cache_call('/api/facilities/dashboard/facilities')
          second, facilities2 = cache_call('/api/facilities/dashboard/facilities')
          assert first in ('MISS', 'HIT'), first
          assert second == 'HIT', second
          assert facilities1 == facilities2
          assert len(facilities2['facilities']) == 15
          print('Redis cache: warmed facilities snapshot is a HIT')

          # Redis downtime cannot prevent dashboard requests.
          import subprocess
          subprocess.run(['docker', 'compose', '--profile', 'relocation',
                          'stop', 'redis'], check=True)
          status, fallback = cache_call('/api/facilities/dashboard/facilities')
          assert status == 'BYPASS', status
          assert len(fallback['facilities']) == 15
          print('Redis unavailable: dashboard request safely bypassed cache')
          PY
      - name: Container status and recent logs
        if: always()
        run: |
          docker compose --profile relocation ps
          docker compose --profile relocation logs --tail 35
      - name: Clean up containers
        if: always()
        run: docker compose --profile relocation down -v
