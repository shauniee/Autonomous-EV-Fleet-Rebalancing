name: Phase 5C checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest revision of a pull request needs an expensive validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  telemetry-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twin_test
          POSTGRES_PASSWORD: twin_test
          POSTGRES_DB: twin_history_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twin_test -d twin_history_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Verify transactional telemetry history in a disposable Postgres
        env:
          TELEMETRY_TEST_DATABASE_URL: postgresql://twin_test:twin_test@127.0.0.1:5432/twin_history_test
        run: python -m pytest tests/integration/test_telemetry_postgres.py -q

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: docker compose --profile relocation config --quiet

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            simulation-console/frontend/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Run dashboard tests
        working-directory: dashboard
        run: npm test -- --run
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Install simulation console dependencies
        working-directory: simulation-console/frontend
        run: npm ci
      - name: Build simulation console
        working-directory: simulation-console/frontend
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and start live Compose demonstration
        run: |
          docker compose --profile relocation up --build -d --wait \
            fleet demand rebalancing dispatch facilities ev-moving-01 ev-moving-02 dashboard
      - name: Verify live parking-aware batch approval
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from uuid import uuid4

          origin = 'http://127.0.0.1:8080'
          def request(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              headers = {'Content-Type': 'application/json'} if data else {}
              req = urllib.request.Request(origin + path, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=8) as res:
                  return json.load(res)

          for attempt in range(45):
              try:
                  fleet = request('/api/fleet/vehicles')
                  available = [v for v in fleet['vehicles']
                               if v['effective_availability'] == 'AVAILABLE']
                  if len(available) >= 2:
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise AssertionError('Two fresh moving EVs were not available for smoke test')

          sites = request('/api/facilities/facilities?zone_id=cbd')
          assert sites['data_source'] == 'MOCK'
          assert len(sites['facilities']) == 3
          proposal = request('/api/rebalancing/batch-recommendations',
                             {'target_zone_id': 'cbd', 'quantity': 2})
          assert proposal['recommended_count'] == 2, proposal
          approval = request('/api/dispatch/batches',
                             {'request_id': str(uuid4()),
                              'batch_recommendation_id': proposal['batch_recommendation_id']})
          assert approval['status'] == 'APPROVED', approval
          assert len(approval['items']) == 2, approval
          print('Compose live batch smoke: 2 mock parking-aware EV dispatches approved')
          PY
      - name: Container status and recent logs
        if: always()
        run: |
          docker compose --profile relocation ps
          docker compose --profile relocation logs --tail 35
      - name: Clean up containers
        if: always()
        run: docker compose --profile relocation down -v
