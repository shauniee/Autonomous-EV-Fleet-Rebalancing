name: Kubernetes portability checks

on:
  workflow_dispatch:

# Only the newest revision of a pull request needs an expensive validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'
      - name: Render local Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/ev-fleet.yaml
      - name: Verify dashboard HPA and singleton stateful services
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          documents = list(yaml.safe_load_all(Path('/tmp/ev-fleet.yaml').read_text()))
          objects = {(o['kind'], o['metadata']['name']): o for o in documents}
          hpa = objects['HorizontalPodAutoscaler', 'dashboard']
          assert hpa['metadata']['namespace'] == 'ev-fleet'
          spec = hpa['spec']
          assert spec['scaleTargetRef'] == {
              'apiVersion': 'apps/v1', 'kind': 'Deployment', 'name': 'dashboard'
          }
          assert (spec['minReplicas'], spec['maxReplicas']) == (1, 3)
          assert spec['metrics'][0]['resource']['target']['averageUtilization'] == 60
          dashboard = objects['Deployment', 'dashboard']
          cpu_request = dashboard['spec']['template']['spec']['containers'][0]['resources']['requests']['cpu']
          assert cpu_request == '10m'
          for name in ('fleet', 'demand', 'rebalancing', 'dispatch',
                       'facilities', 'ev-moving-01', 'ev-moving-02'):
              assert objects['Deployment', name]['spec']['replicas'] == 1, name
          assert objects['StatefulSet', 'ev-moving-extra']['spec']['replicas'] == 18
          print('Kustomize, HPA target, dashboard CPU request and singleton service checks passed.')
          PY
      - name: Validate safe PostgreSQL hostpath initialisation
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          objects = {
              (obj['kind'], obj['metadata']['name']): obj
              for obj in yaml.safe_load_all(Path('/tmp/ev-fleet.yaml').read_text())
          }
          pg = objects['StatefulSet', 'postgres']
          init = pg['spec']['template']['spec']['initContainers'][0]
          command = init['args'][0]
          assert init['name'] == 'initialize-postgres-volume'
          assert 'PG_VERSION' in command
          assert "stat -c '%u:%g'" in command
          assert "stat -c '%a'" in command
          assert 'chown -R' not in command
          assert 'Existing PostgreSQL data ownership verified' in command
          assert 'refusing to mutate stored database' in command
          print('PostgreSQL keeps existing data intact and verifies permissions before startup.')
          PY
      - name: Verify PostgreSQL bootstrap, authentication and readiness contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          documents = yaml.safe_load_all(Path('/tmp/ev-fleet.yaml').read_text())
          objects = {(obj['kind'], obj['metadata']['name']): obj for obj in documents}
          pg = objects['StatefulSet', 'postgres']['spec']['template']['spec']['containers'][0]
          env = {item['name']: item for item in pg['env']}
          assert env['POSTGRES_HOST_AUTH_METHOD']['value'] == 'scram-sha-256'
          assert env['POD_IP']['valueFrom']['fieldRef']['fieldPath'] == 'status.podIP'

          startup = pg['startupProbe']
          assert startup['failureThreshold'] * startup['periodSeconds'] >= 600
          assert 'pg_isready' in ' '.join(startup['exec']['command'])
          assert '-h 127.0.0.1' in ' '.join(startup['exec']['command'])

          ready = pg['readinessProbe']['exec']['command']
          assert ready[:2] == ['sh', '-ec']
          assert 'PGPASSWORD' in ready[2]
          assert 'psql ' in ready[2] and 'SELECT 1' in ready[2]
          assert '-h "$POD_IP"' in ready[2]
          assert 'POSTGRES_DB' in ready[2]
          assert pg['readinessProbe']['timeoutSeconds'] >= 5

          live = ' '.join(pg['livenessProbe']['exec']['command'])
          assert 'pg_isready' in live and 'psql' not in live
          script = Path('scripts/start-kubernetes.ps1').read_text()
          assert 'Assert-ExistingPostgresHealthy' in script
          # Use the authoritative Kubernetes status.podIP, not hostname resolution.
          assert "get pod postgres-0 -o jsonpath='{.status.podIP}'" in script
          assert "Replace('__POD_IP__', $podIp)" in script
          assert 'PGPASSWORD=$POSTGRES_PASSWORD' in script
          assert 'psql -X -qAt -w -h __POD_IP__' in script
          assert 'SELECT/**/1' in script
          assert 'exec postgres-0 -c postgres -- sh -c $sqlCheck' in script
          # No encoded shell pipeline: avoid quoting differences on Windows PowerShell 5.1.
          assert 'base64 -d | sh' not in script
          assert 'No PVC data was changed' in script
          assert '$CheckPostgresOnly' in script
          assert 'if ($CheckPostgresOnly)' in script
          assert 'PostgreSQL-only check passed' in script
          assert 'No images, Pods, or persistent volumes were changed' in script
          print('PostgreSQL real TCP startup, SQL readiness, SCRAM auth and fail-closed preflight are configured.')
          PY
      - name: Validate optional customer simulation workloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          docs = {}
          for kind, name, filename in (
              ('Job', 'customer-rental-simulation', 'customer-job.yaml'),
              ('Deployment', 'customer-rental-demo', 'customer-deployment.yaml'),
          ):
              obj = yaml.safe_load(Path('k8s/simulations', filename).read_text())
              assert obj['kind'] == kind and obj['metadata']['name'] == name
              assert obj['metadata']['namespace'] == 'ev-fleet'
              if kind == 'Job':
                  assert obj['spec']['template']['spec']['restartPolicy'] == 'Never'
              else:
                  assert obj['spec']['template']['spec'].get('restartPolicy', 'Always') == 'Always'
              assert obj['spec']['template']['spec']['containers'][0]['imagePullPolicy'] == 'Never'
              assert obj['spec']['template']['metadata']['labels']['app.kubernetes.io/group'] == 'simulations'
              docs[kind] = obj
          assert docs['Job']['spec']['parallelism'] == 1
          assert docs['Job']['spec']['backoffLimit'] == 0
          assert docs['Deployment']['spec']['replicas'] == 0
          assert docs['Deployment']['spec']['strategy']['type'] == 'Recreate'
          print('Rental Deployment is preinstalled with zero replicas; job remains opt-in.')
          PY
      - name: Verify versioned deployment image rendering and preflight hooks
        shell: pwsh
        run: |
          $script = Get-Content -Raw scripts/start-kubernetes.ps1
          foreach ($required in @('$ConnectOnly', '$CheckPostgresOnly', 'Assert-SafeToRedeploy',
                                  'kubectl kustomize', 'rollout status',
                                  'dry-run=client', 'customer-rental-demo')) {
            if (-not $script.Contains($required)) {
              throw "Missing required deployment safety hook: $required"
            }
          }
          $base = (kubectl kustomize k8s) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw 'Kustomize failed' }
          $rendered = $base
          $tag = 'ci-test-version-123'
          foreach ($name in @('backend', 'dashboard', 'simulation-console')) {
            $old = "csc3104/ev-fleet-$($name):k8s-local"
            $new = "csc3104/ev-fleet-$($name):$tag"
            if (-not $rendered.Contains($old)) { throw "Template image not found: $old" }
            $rendered = $rendered.Replace($old, $new)
            if (-not $rendered.Contains($new)) { throw "Versioned image not rendered: $new" }
          }
          if ($rendered.Contains(':k8s-local')) { throw 'Unversioned image remains in rendered manifests' }
          Write-Host 'All local workload images can be rendered with one unique tag.'

      - name: Parse Windows PowerShell deployment scripts
        shell: pwsh
        run: |
          foreach ($file in @('scripts/start-kubernetes.ps1', 'scripts/setup-local-metrics.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell syntax errors in $file"
            }
          }

  postgres-bootstrap-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify first-start and reused-volume TCP password authentication
        shell: bash
        run: |
          set -euo pipefail
          name="ev-pg-bootstrap-${GITHUB_RUN_ID}"
          docker network create "$name"
          docker volume create "$name"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker network rm "$name" >/dev/null 2>&1 || true
            docker volume rm "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$name" --network "$name" \
            -v "$name":/var/lib/postgresql/data \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            -e POSTGRES_USER=ev_fleet \
            -e POSTGRES_DB=ev_fleet \
            -e POSTGRES_PASSWORD=ci-test-only \
            -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            postgres:17-alpine

          check_remote_sql() {
            docker run --rm --network "$name" \
              -e PGPASSWORD=ci-test-only postgres:17-alpine \
              psql -X -qAt -h "$name" -U ev_fleet -d ev_fleet -c 'SELECT 1'
          }
          ready=0
          for attempt in $(seq 1 90); do
            if [ "$(check_remote_sql 2>/dev/null)" = "1" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$name" | tail -80
            echo "PostgreSQL failed network SQL bootstrap" >&2
            exit 1
          fi
          docker exec "$name" psql -U ev_fleet -d ev_fleet -XAt -c \
            "SELECT COUNT(*) FROM pg_database WHERE datname IN ('ev_fleet','postgres','template0','template1')" |
            grep -qx 4

          # A new container on the SAME PVC must retain the completed bootstrap.
          docker rm -f "$name"
          docker run -d --name "$name" --network "$name" \
            -v "$name":/var/lib/postgresql/data \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            -e POSTGRES_USER=ev_fleet \
            -e POSTGRES_DB=ev_fleet \
            -e POSTGRES_PASSWORD=ci-test-only \
            -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            postgres:17-alpine
          ready=0
          for attempt in $(seq 1 30); do
            if [ "$(check_remote_sql 2>/dev/null)" = "1" ]; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" -eq 1 ] || { docker logs "$name" | tail -80; exit 1; }
          echo "First startup, persistent reuse, database creation and Pod-like TCP authentication passed."
