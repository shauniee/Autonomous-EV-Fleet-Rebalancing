name: Kubernetes portability checks

on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'scripts/start-kubernetes.ps1'
      - 'scripts/setup-local-metrics.ps1'
      - '.github/workflows/kubernetes-portability.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/start-kubernetes.ps1'
      - 'scripts/setup-local-metrics.ps1'
      - '.github/workflows/kubernetes-portability.yml'

# Only the newest revision of a pull request needs an expensive validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'
      - name: Render local Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/ev-fleet.yaml
      - name: Verify dashboard HPA and singleton stateful services
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          documents = list(yaml.safe_load_all(Path('/tmp/ev-fleet.yaml').read_text()))
          objects = {(o['kind'], o['metadata']['name']): o for o in documents}
          hpa = objects['HorizontalPodAutoscaler', 'dashboard']
          assert hpa['metadata']['namespace'] == 'ev-fleet'
          spec = hpa['spec']
          assert spec['scaleTargetRef'] == {
              'apiVersion': 'apps/v1', 'kind': 'Deployment', 'name': 'dashboard'
          }
          assert (spec['minReplicas'], spec['maxReplicas']) == (1, 3)
          assert spec['metrics'][0]['resource']['target']['averageUtilization'] == 60
          dashboard = objects['Deployment', 'dashboard']
          cpu_request = dashboard['spec']['template']['spec']['containers'][0]['resources']['requests']['cpu']
          assert cpu_request == '10m'
          for name in ('fleet', 'demand', 'rebalancing', 'dispatch',
                       'facilities', 'ev-moving-01', 'ev-moving-02'):
              assert objects['Deployment', name]['spec']['replicas'] == 1, name
          assert objects['StatefulSet', 'ev-moving-extra']['spec']['replicas'] == 18
          print('Kustomize, HPA target, dashboard CPU request and singleton service checks passed.')
          PY
      - name: Validate safe PostgreSQL hostpath initialisation
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          objects = {
              (obj['kind'], obj['metadata']['name']): obj
              for obj in yaml.safe_load_all(Path('/tmp/ev-fleet.yaml').read_text())
          }
          pg = objects['StatefulSet', 'postgres']
          init = pg['spec']['template']['spec']['initContainers'][0]
          command = init['args'][0]
          assert init['name'] == 'initialize-postgres-volume'
          assert 'PG_VERSION' in command
          assert "stat -c '%u:%g'" in command
          assert "stat -c '%a'" in command
          assert 'chown -R' not in command
          assert 'Existing PostgreSQL data ownership verified' in command
          assert 'refusing to mutate stored database' in command
          print('PostgreSQL keeps existing data intact and verifies permissions before startup.')
          PY
      - name: Validate optional customer simulation workloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          docs = {}
          for kind, name, filename in (
              ('Job', 'customer-rental-simulation', 'customer-job.yaml'),
              ('Deployment', 'customer-rental-demo', 'customer-deployment.yaml'),
          ):
              obj = yaml.safe_load(Path('k8s/simulations', filename).read_text())
              assert obj['kind'] == kind and obj['metadata']['name'] == name
              assert obj['metadata']['namespace'] == 'ev-fleet'
              if kind == 'Job':
                  assert obj['spec']['template']['spec']['restartPolicy'] == 'Never'
              else:
                  assert obj['spec']['template']['spec'].get('restartPolicy', 'Always') == 'Always'
              assert obj['spec']['template']['spec']['containers'][0]['imagePullPolicy'] == 'Never'
              assert obj['spec']['template']['metadata']['labels']['app.kubernetes.io/group'] == 'simulations'
              docs[kind] = obj
          assert docs['Job']['spec']['parallelism'] == 1
          assert docs['Job']['spec']['backoffLimit'] == 0
          assert docs['Deployment']['spec']['replicas'] == 0
          assert docs['Deployment']['spec']['strategy']['type'] == 'Recreate'
          print('Rental Deployment is preinstalled with zero replicas; job remains opt-in.')
          PY
      - name: Verify versioned deployment image rendering and preflight hooks
        shell: pwsh
        run: |
          $script = Get-Content -Raw scripts/start-kubernetes.ps1
          foreach ($required in @('$ConnectOnly', 'Assert-SafeToRedeploy',
                                  'kubectl kustomize', 'rollout status',
                                  'dry-run=client', 'customer-rental-demo')) {
            if (-not $script.Contains($required)) {
              throw "Missing required deployment safety hook: $required"
            }
          }
          $base = (kubectl kustomize k8s) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw 'Kustomize failed' }
          $rendered = $base
          $tag = 'ci-test-version-123'
          foreach ($name in @('backend', 'dashboard', 'simulation-console')) {
            $old = "csc3104/ev-fleet-$($name):k8s-local"
            $new = "csc3104/ev-fleet-$($name):$tag"
            if (-not $rendered.Contains($old)) { throw "Template image not found: $old" }
            $rendered = $rendered.Replace($old, $new)
            if (-not $rendered.Contains($new)) { throw "Versioned image not rendered: $new" }
          }
          if ($rendered.Contains(':k8s-local')) { throw 'Unversioned image remains in rendered manifests' }
          Write-Host 'All local workload images can be rendered with one unique tag.'

      - name: Parse Windows PowerShell deployment scripts
        shell: pwsh
        run: |
          foreach ($file in @('scripts/start-kubernetes.ps1', 'scripts/setup-local-metrics.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell syntax errors in $file"
            }
          }
